<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ronn.cc</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    font: 400 1rem/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #0f0f0f;
    color: #e8e8e8;
  }
  main { max-width: 32rem; }
  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 400;
    letter-spacing: -0.03em;
  }
  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    margin-left: 0.1em;
    background: #4ade80;
    vertical-align: text-bottom;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
  p { margin: 0; color: #8a8a8a; font-size: 0.9rem; }
</style>
</head>
<body>
  <main>
    <h1>ronn.cc<span class="cursor" aria-hidden="true"></span></h1>
    <p>Deployed and running. Real site in progress.</p>
  </main>
</body>
</html>
